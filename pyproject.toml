[project]
name = "lifecomicai"
version = "0.1.0"
description = "LifeOS Story Graph Core Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "Pillow>=10.0.0",
    "httpx>=0.26.0",
    "redis>=5.0.0",
    "langchain-openai>=0.2.0",
    "qianfan>=0.3.0",
    "openai>=1.6.0",
    "ollama>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "aiosqlite>=0.19.0",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
